name: teman_kereta
description: Pendamping perjalanan KRL yang berjalan local-first dan offline-capable.
publish_to: none
version: 1.0.5+6


environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.8"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  archive: ^4.0.9
  cached_network_image: ^3.4.1
  clock: ^1.1.2
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  dio: ^5.11.0
  drift: ^2.34.3
  file_picker: ">=12.0.0-beta.1 <13.0.0"
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^22.2.0
  flutter_map: ^7.0.2
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.3.1
  flutter_tts: ^4.2.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  gtfs_realtime_bindings: ^1.2.0
  image_picker: ^1.1.2
  intl: 0.20.2
  json_annotation: ^4.12.0
  latlong2: ^0.9.1
  maplibre_gl: ^0.26.2
  package_info_plus: ^10.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sentry_flutter: ^9.26.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.16.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: 2.15.1
  drift_dev: 2.34.0
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  freezed: 3.2.5
  json_serializable: 6.14.1
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-Variable.ttf
          style: italic
