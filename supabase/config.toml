# Local Supabase stack configuration for Teman Kereta.
# Intentionally contains no [remotes] section or hosted project reference.
project_id = "teman-kereta-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326
admin_email = "admin@temankereta.local"
sender_name = "Teman Kereta Local"

[storage]
enabled = true
file_size_limit = "250MiB"

[auth]
enabled = true
# Deep link scheme for the Flutter app — confirmation and password-reset emails
# will redirect here so the app (not the admin web panel) handles them.
site_url = "temankereta://app"
additional_redirect_urls = [
  "temankereta://app",
  "temankereta://app/account/reset-password",
  "http://127.0.0.1:3000",
  "http://localhost:3000",
  "io.supabase.temankereta://login-callback/",
  "https://www.temankereta.web.id",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Webhook deauthorize/data-deletion dari Meta. Meta tidak mengirim header
# Authorization apa pun, jadi verifikasi JWT Supabase harus dimatikan —
# keasliannya dibuktikan lewat tanda tangan HMAC signed_request di dalam
# fungsinya sendiri. Lihat supabase/functions/threads-callbacks/index.ts.
[functions.threads-callbacks]
verify_jwt = false
