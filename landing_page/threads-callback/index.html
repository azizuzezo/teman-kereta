<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Halaman internal untuk sekali-dua kali pakai saat menghubungkan akun
       Threads. Tidak ditautkan dari mana pun dan tidak boleh diindeks. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Threads Callback — Teman Kereta</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           background: #f8fafc; color: #0f172a; margin: 0;
           display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
            padding: 28px; max-width: 560px; width: 100%;
            box-shadow: 0 1px 3px rgb(15 23 42 / 0.06); }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { color: #475569; font-size: 14px; line-height: 1.6; margin: 0 0 16px; }
    code { display: block; background: #f1f5f9; border: 1px solid #e2e8f0;
           border-radius: 10px; padding: 14px; font-size: 13px;
           word-break: break-all; margin-bottom: 14px; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 10px;
             padding: 10px 16px; font-size: 14px; font-weight: 600;
             cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Authorization code Threads</h1>
    <p id="hint">Menyalin code dari URL…</p>
    <code id="code">—</code>
    <button id="copy" hidden>Salin code</button>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      // Meta menempelkan '#_' di ujung code saat redirect lewat browser.
      var code = (params.get('code') || '').replace(/#_$/, '');
      var error = params.get('error_description') || params.get('error');
      var hint = document.getElementById('hint');
      var box = document.getElementById('code');
      var copy = document.getElementById('copy');

      if (error) {
        hint.className = 'err';
        hint.textContent = 'Otorisasi ditolak atau gagal:';
        box.textContent = error;
        return;
      }
      if (!code) {
        hint.textContent = 'Tidak ada parameter ?code= di URL ini. Ulangi dari: node scripts/threads-connect.mjs --url';
        return;
      }

      hint.innerHTML = 'Salin code di bawah, lalu jalankan di terminal:<br><strong>node scripts/threads-connect.mjs --code &lt;CODE&gt;</strong><br>Code ini sekali pakai dan hanya berlaku beberapa menit.';
      box.textContent = code;
      copy.hidden = false;
      copy.addEventListener('click', function () {
        navigator.clipboard.writeText(code).then(function () {
          copy.textContent = 'Tersalin';
          setTimeout(function () { copy.textContent = 'Salin code'; }, 1500);
        });
      });
    })();
  </script>
</body>
</html>
