    <rect x="175" y="132" width="145" height="75" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="195" cy="156" r="8" fill="#8b5cf6" fill-opacity="0.2"/>
    <circle cx="195" cy="156" r="3" fill="#a78bfa"/>
